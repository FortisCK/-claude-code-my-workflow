# Task 2 (collision detection) GPU runtime environment.
# Superset of environment-task1-gpu.yml: the Task 2 submission inference pipeline
# (scripts/task2/run_task2_submission_inference.py -> run_stage2aq_hidden_pipeline.py)
# additionally requires `ultralytics` for the YOLO proposal stage
# (export_yolo_nogt_proposals.py imports ultralytics.YOLO), which was the one
# hard dependency missing from both task1 env files. NOTE: ultralytics YOLO11 is
# AGPL-3.0 — see quality_reports/decisions/2026-06-15_external_asset_license_manifest.md.
name: cathaction-task2-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - pillow
  - opencv
  - pyyaml
  - tqdm
  - matplotlib
  - scikit-learn
  - pytest
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - ultralytics>=8.3
      - monai>=1.5
      - timm>=1.0
      - segmentation-models-pytorch>=0.5
      - transformers>=4.41
