# ttunet_v1.yaml — TT U-Net (Deng et al., IEEE TMI 2023) published baseline.
#
# Faithful port (code/models/ttunet.py) trained on the SAME precomputed
# (clean, corrupted) pairs, frozen split, normalization, and L1+gradient loss
# as unet_v1 — so the comparison isolates the architecture.
# z-axis = temporal sequence (see plan 2026-06-21_ttunet-baseline-reproduction.md).

run:
  slug: "ttunet_v1"
  seed: 42
  device: "cuda"

data:
  processed_dir: null
  case_ids_train: null
  case_ids_val: null
  split_file: "data/imagecas/splits/v1.json"
  val_split: 0.05
  pair_mode: "precomputed"
  num_workers: 4
  pin_memory: true
  persistent_workers: true

augmentation:
  p_flip: 0.5
  rotate_range_deg: 5.0
  shift_range_voxels: 2

model:
  cnum: 24                       # TT U-Net base width (paper default)

loss:
  l1_weight: 1.0
  l2_weight: 0.0
  gradient_weight: 0.05         # matches unet_v1 — isolates architecture

ema:
  enabled: true
  decay: 0.999

optim:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0

train:
  batch_size: 1
  patch_size: [64, 128, 128]    # depth-64 temporal clip x 128^2 spatial (~6 GB; coexists w/ user GPU job)
  n_epochs: 100
  grad_accum_steps: 1
  amp: true
  log_every_steps: 50
  ckpt_every_epochs: 10
  ckpt_dir: "experiments/checkpoints/ttunet_v1"

wandb:
  project: "cardiac-diffusion"
  enabled: false
