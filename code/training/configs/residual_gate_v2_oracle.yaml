# residual_gate_v2_oracle.yaml - reliability gate with oracle gate supervision.
#
# This keeps the v1 posterior residual setup, but adds an explicit per-voxel
# gate target:
#
#   g* = clamp(((clean - unet_initial) * residual_mean) / residual_mean^2, 0, g_max)
#
# The oracle target is used only as an auxiliary reliability calibration loss.
# The final image loss still decides whether the released residual is useful.

run:
  slug: "residual_gate_v2_oracle"
  seed: 42
  device: "cuda"

data:
  cache_dir: "experiments/cache/residual_diffusion_features/v1_train100_val20_test5"
  train_splits: ["train"]
  val_splits: ["val"]
  case_ids_train: null
  case_ids_val: null
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:
  in_channels: 6
  features: [16, 16, 32, 64, 128, 16]
  g_max: 0.25
  init_bias: -4.0
  clamp_output: false

loss:
  final_l1_weight: 1.0
  heart_l1_weight: 1.5
  boundary_l1_weight: 1.5
  boundary_gradient_weight: 0.2
  gate_l1_weight: 0.005
  gate_tv_weight: 0.01
  boundary_radius: 3

  # Auxiliary oracle gate calibration.  Positive and local anatomical regions
  # receive higher weights so the model does not learn the trivial all-zero gate.
  oracle_gate_weight: 0.05
  oracle_gate_loss: "bce"
  oracle_gate_eps: 1.0e-5
  oracle_gate_min_target: 0.01
  oracle_gate_base_weight: 0.25
  oracle_gate_positive_weight: 4.0
  oracle_gate_heart_weight: 1.0
  oracle_gate_boundary_weight: 3.0

ema:
  enabled: true
  decay: 0.999

optim:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 0.0

train:
  batch_size: 1
  patch_size: [128, 128, 128]
  samples_per_case_per_epoch: 4
  heart_patch_prob: 0.75
  n_epochs: 20
  grad_accum_steps: 1
  amp: true
  log_every_steps: 25
  ckpt_every_epochs: 5
  ckpt_dir: "experiments/checkpoints/residual_gate_v2_oracle"

wandb:
  project: "cardiac-diffusion"
  enabled: true
