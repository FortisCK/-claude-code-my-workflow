name: task1_baseline_unet_multiclass_weighted_gpu_pilot
seed: 20260520

paths:
  repo_root: .
  train_manifest: configs/task1/splits/released_train.csv
  eval_manifest: configs/task1/splits/released_eval.csv
  output_dir: outputs/task1/baseline_unet_multiclass_weighted_gpu_pilot

data:
  image_size: [256, 256]
  label_mode: multiclass_012
  threshold: 0.5
  max_train_samples: 2048
  max_eval_samples: 512
  max_predict_samples: 32

model:
  name: tiny_unet
  in_channels: 3
  out_channels: 3
  base_channels: 16

loss:
  name: weighted_cross_entropy
  # Computed from the first 2048 released-train masks after 256x256 nearest resize:
  # counts {0: 133331142, 1: 677236, 2: 209350}; inverse-frequency, mean-normalized.
  class_weights: [0.003593860466557044, 0.7075428952310618, 2.288863244302381]

training:
  device: cuda
  epochs: 8
  batch_size: 16
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  log_interval: 25
