name: task1_baseline_unet_multiclass_pilot
seed: 20260520

paths:
  repo_root: .
  train_manifest: configs/task1/splits/released_train.csv
  eval_manifest: configs/task1/splits/released_eval.csv
  output_dir: outputs/task1/baseline_unet_multiclass_pilot

data:
  image_size: [256, 256]
  label_mode: multiclass_012
  threshold: 0.5
  max_train_samples: 512
  max_eval_samples: 128
  max_predict_samples: 16

model:
  name: tiny_unet
  in_channels: 3
  out_channels: 3
  base_channels: 16

training:
  device: auto
  epochs: 3
  batch_size: 4
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  log_interval: 25
