name: task1_baseline_unet_smoke
seed: 20260520

paths:
  repo_root: .
  train_manifest: configs/task1/splits/released_train.csv
  eval_manifest: configs/task1/splits/released_eval.csv
  output_dir: outputs/task1/baseline_unet_smoke

data:
  image_size: [128, 128]
  label_mode: binary_foreground
  threshold: 0.5
  max_train_samples: 16
  max_eval_samples: 8
  max_predict_samples: 4

model:
  name: tiny_unet
  in_channels: 3
  out_channels: 1
  base_channels: 8

training:
  device: auto
  epochs: 1
  batch_size: 2
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  log_interval: 5
