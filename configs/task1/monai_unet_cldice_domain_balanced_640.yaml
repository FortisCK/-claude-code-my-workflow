name: task1_monai_unet_cldice_domain_balanced_640
seed: 20260521

paths:
  repo_root: .
  train_manifest: configs/task1/splits/released_train.csv
  eval_manifest: configs/task1/splits/released_eval.csv
  output_dir: outputs/task1/monai_unet_cldice_domain_balanced_640

data:
  image_size: [640, 640]
  resize_mode: aspect_pad
  label_mode: multiclass_012
  threshold: 0.5
  max_train_samples: null
  max_eval_samples: null
  max_predict_samples: 64
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    affine_prob: 0.35
    rotate_range: 0.04
    translate_pixels: 16
    scale_range: 0.04
    gaussian_noise_prob: 0.15
    gaussian_noise_std: 0.01

model:
  name: monai_unet
  spatial_dims: 2
  in_channels: 3
  out_channels: 3
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  act: PRELU
  norm: BATCH
  dropout: 0.05

loss:
  name: monai_dice_ce_cldice
  include_background: true
  class_weights: [0.02, 1.0, 2.0]
  lambda_dice: 1.0
  lambda_ce: 0.5
  label_smoothing: 0.0
  lambda_cldice: 0.3
  cldice_labels: [1, 2]
  cldice_class_weights: [1.0, 1.3]
  cldice_iterations: 8
  cldice_warmup_epochs: 10

training:
  device: cuda
  epochs: 120
  batch_size: 8
  num_workers: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  log_interval: 25
  monitor_metric: eval.dice
  monitor_mode: max
  use_amp: true
  sampling:
    domain_balanced: true
