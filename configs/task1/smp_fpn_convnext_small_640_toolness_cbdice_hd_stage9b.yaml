name: task1_smp_fpn_convnext_small_640_toolness_cbdice_hd_stage9b
seed: 20260602

paths:
  repo_root: .
  train_manifest: configs/task1/splits/released_train.csv
  eval_manifest: configs/task1/splits/released_eval_balanced_1024.csv
  output_dir: outputs/task1/smp_fpn_convnext_small_640_toolness_cbdice_hd_stage9b

data:
  image_size: [640, 640]
  resize_mode: aspect_pad
  label_mode: multiclass_012
  threshold: 0.5
  max_train_samples: null
  max_eval_samples: null
  max_predict_samples: 64
  normalization:
    enabled: true
    preset: imagenet
  augmentation:
    enabled: true
    horizontal_flip_prob: 0.5
    affine_prob: 0.35
    rotate_range: 0.04
    translate_pixels: 16
    scale_range: 0.04
    gaussian_noise_prob: 0.15
    gaussian_noise_std: 0.01

model:
  name: smp
  architecture: FPN
  encoder_name: tu-convnext_small
  encoder_weights: imagenet
  in_channels: 3
  out_channels: 4
  toolness_auxiliary: true
  kwargs: {}

loss:
  name: monai_dice_ce_toolness_cbdice_hd
  include_background: true
  class_weights: [0.02, 1.0, 2.0]
  lambda_dice: 1.0
  lambda_ce: 0.5
  label_smoothing: 0.0
  lambda_toolness: 0.4
  lambda_toolness_bce: 0.5
  lambda_toolness_dice: 1.0
  lambda_cbdice: 0.12
  cbdice_iterations: 10
  cbdice_warmup_epochs: 8
  cbdice_threshold: 0.5
  lambda_hd: 0.03
  hd_warmup_epochs: 15
  hd_include_background: false
  hd_alpha: 2.0
  hd_reduction: mean

training:
  device: cuda
  epochs: 80
  batch_size: 8
  num_workers: 8
  learning_rate: 0.00008
  weight_decay: 0.05
  initial_checkpoint: outputs/task1/smp_fpn_convnext_small_640_toolness_aux_stage7/best_checkpoint.pt
  initial_checkpoint_strict: true
  log_interval: 25
  monitor_metric: eval.dice
  monitor_mode: max
  use_amp: false
  gradient_clip_norm: 1.0
  sampling:
    domain_balanced: true
